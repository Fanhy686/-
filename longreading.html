  <div class="page-head">
    <h1>🗞️ 长篇阅读</h1>
    <p class="sub">四级长篇阅读（段落信息匹配）：一篇约 1000 词、分 A–O 十五段，后跟 10 个陈述句，判断每句出自哪一段。共 5 篇，建议每篇 15 分钟。</p>
  </div>

  <section id="listSec">
    <div class="note">📌 打法：① 先读 10 个陈述句，圈出「人名/数字/专有名词」等定位词 → ② 带着问题扫读全文，重点看段首段尾 → ③ 找到同义替换（题目很少照抄原文）→ ④ 一段只对应一题，做完排除。**不要逐字精读**，长篇阅读考的是快速定位。</div>

    <h2 class="section-title"><span class="ico">📁</span>长篇阅读篇目（点标题进入练习）</h2>
