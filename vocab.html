<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f2a44">
<title>词汇本 · 四级备考工作台</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="assets/css/styles.css?v=5">
</head>
<body data-page="vocab">
<aside id="sidebar"></aside>
<main>
  <div class="page-head">
    <h1>📚 词汇本</h1>
    <p class="sub">四级 + 六级核心词闪卡。点「认识」标记为已掌握，进度自动保存；可只练没掌握的。</p>
  </div>

  <div class="cards c3" style="margin-bottom:14px">
    <div class="card"><div class="row"><span class="c-ico">📊</span><div class="stat"><div class="num" id="vTotal">0</div><div class="lab">当前词库</div></div></div></div>
    <div class="card"><div class="row"><span class="c-ico">✅</span><div class="stat"><div class="num accent" id="vMastered">0</div><div class="lab">已掌握</div></div></div></div>
    <div class="card"><div class="row"><span class="c-ico">🔁</span><div class="stat"><div class="num" id="vRemain">0</div><div class="lab">未掌握</div></div></div></div>
  </div>

  <div class="row" style="margin-bottom:8px">
    <button class="btn sm" data-lv="all">🔠 全部</button>
    <button class="btn sm ghost" data-lv="4">🎓 四级</button>
    <button class="btn sm ghost" data-lv="6">🏅 六级</button>
    <span class="spacer"></span>
    <span class="muted" id="libInfo" style="font-size:13px"></span>
  </div>

  <div class="row" style="margin-bottom:14px">
    <button class="btn sm" id="modeBtn">👁️ 只看未掌握：关</button>
    <button class="btn sm ghost" id="shuffleBtn">🔀 打乱顺序</button>
    <button class="btn sm ghost" id="resetBtn">♻️ 重置掌握</button>
    <span class="spacer"></span>
    <span class="muted" id="posInfo"></span>
  </div>

  <div class="flash" id="flash">
    <div class="word" id="fWord">--</div>
    <div class="ph" id="fPh"></div>
    <div class="row" style="justify-content:center;gap:8px">
      <span class="pos" id="fPos"></span>
      <span class="tag" id="fLv"></span>
    </div>
    <div class="cn" id="fCn" style="display:none"></div>
    <div class="ex" id="fEx" style="display:none"></div>
  </div>

  <div class="row" style="margin-top:16px;justify-content:center">
    <button class="btn ghost" id="prevBtn">⬅️ 上一张</button>
    <button class="btn ghost" id="flipBtn">🔃 翻转释义</button>
    <button class="btn" id="knowBtn">✅ 认识（下一）</button>
    <button class="btn ghost" id="unknowBtn">❌ 不认识（下一）</button>
  </div>

  <hr>
  <div class="note">💡 方法：先凭词形/读音猜意思，再「翻转释义」核对；会的打「认识」移出未掌握池，不会的反复出现直到记住。每天 20–30 个新词 + 复习旧词即可。四级保过先刷「🎓 四级」池，有余力再进「🏅 六级」。</div>
</main>

<script src="assets/js/store.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/vocab-data.js"></script>
<script src="assets/js/vocab-data-cet4b.js"></script>
<script src="assets/js/vocab-data-cet6a.js"></script>
<script src="assets/js/vocab-data-cet6b.js"></script>
<script src="assets/js/vocab-data-cet6c.js"></script>
<script src="assets/js/vocab.js"></script>
</body>
</html>
