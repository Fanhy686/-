<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f2a44">
<title>打卡 · 四级备考工作台</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="assets/css/styles.css?v=5">
</head>
<body data-page="checkin">
<aside id="sidebar"></aside>
<main>
  <div class="page-head">
    <h1>✅ 每日打卡</h1>
    <p class="sub">勾选今日任务，点「完成今日打卡」累计连续天数。数据本机保存，关掉不丢。</p>
  </div>

  <div class="cards c3" style="margin-bottom:16px">
    <div class="card"><div class="row"><span class="c-ico">🔥</span><div class="stat"><div class="num accent" id="streak">0</div><div class="lab">连续打卡（天）</div></div></div></div>
    <div class="card"><div class="row"><span class="c-ico">📅</span><div class="stat"><div class="num" id="totalDays">0</div><div class="lab">累计打卡（天）</div></div></div></div>
    <div class="card"><div class="row"><span class="c-ico">📆</span><div class="stat"><div class="num" id="today">--</div><div class="lab">今天日期</div></div></div></div>
  </div>

  <h2 class="section-title"><span class="ico">📝</span>今日任务</h2>
  <div id="tasks"></div>
  <div class="row" style="margin-top:8px">
    <button class="btn" id="checkinBtn">✅ 完成今日打卡</button>
    <button class="btn ghost" id="resetToday">↺ 重置今天</button>
    <span class="spacer"></span>
    <span class="muted" id="doneHint"></span>
  </div>

  <h2 class="section-title"><span class="ico">🗓️</span>最近 7 天</h2>
  <div class="cards c7" id="weekStrip" style="grid-template-columns:repeat(7,1fr)"></div>
</main>

<script src="assets/js/store.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/checkin.js"></script>
</body>
</html>
